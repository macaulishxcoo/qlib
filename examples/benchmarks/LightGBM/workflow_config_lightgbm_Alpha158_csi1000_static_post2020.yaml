# 方案B（对照）：csi1000 仅用2020后数据（2020-2023训练，2024验证，2025-2026测试）
# 运行：qrun workflow_config_lightgbm_Alpha158_csi1000_static_post2020.yaml --uri_folder /home/xiaocong/worksapces/qlib/output/mlruns_static
experiment_name: static_csi1000_post2020
qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data_2026"
    region: cn
market: &market csi1000
benchmark: &benchmark SH000852
data_handler_config: &data_handler_config
    start_time: 2020-01-01
    end_time: 2026-07-23
    fit_start_time: 2020-01-01
    fit_end_time: 2023-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2025-01-01
        end_time: 2026-07-23
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.9
            learning_rate: 0.1
            subsample: 0.9
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 250
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-01-01, 2023-12-31]
                valid: [2024-01-01, 2024-12-31]
                test: [2025-01-01, 2026-07-23]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
